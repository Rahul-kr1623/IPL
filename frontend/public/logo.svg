<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="50%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M100 15 L175 45 C175 115 135 165 100 185 C65 165 25 115 25 45 Z" 
        fill="url(#bgGrad)" stroke="url(#neonGrad)" stroke-width="4" filter="url(#glow)"/>
  
  <path d="M100 25 L165 52 C165 112 130 155 100 172 C70 155 35 112 35 52 Z" 
        fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1.5"/>

  <!-- Cricket Wickets / Stumps -->
  <rect x="80" y="65" width="6" height="55" rx="3" fill="url(#neonGrad)"/>
  <rect x="97" y="65" width="6" height="55" rx="3" fill="url(#neonGrad)"/>
  <rect x="114" y="65" width="6" height="55" rx="3" fill="url(#neonGrad)"/>

  <!-- Bails -->
  <rect x="76" y="60" width="22" height="4" rx="2" fill="url(#goldGrad)"/>
  <rect x="102" y="60" width="22" height="4" rx="2" fill="url(#goldGrad)"/>

  <!-- Cricket Ball Trajectory / Swoosh -->
  <path d="M45 130 C75 160 135 130 155 75" 
        fill="none" stroke="url(#goldGrad)" stroke-width="4" stroke-dasharray="4 3"/>

  <!-- Ball -->
  <circle cx="155" cy="75" r="9" fill="#f43f5e" stroke="#fff" stroke-width="2"/>
  <path d="M150 71 Q155 75 160 71 M150 79 Q155 75 160 79" 
        stroke="#fff" stroke-width="1.5" fill="none"/>

  <!-- 2026 Typography -->
  <text x="100" y="152" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" 
        font-weight="900" font-size="20" fill="#ffffff" letter-spacing="3">IPL 2026</text>
</svg>
